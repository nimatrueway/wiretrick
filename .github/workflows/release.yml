name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    # one runner per OS; `targets` lists what it builds (first = host,
    # which is also where the tests run). Both macOS targets share the
    # Intel runner: Apple Silicon runners often queue for a long time.
    name: helper (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, targets: x86_64-unknown-linux-gnu, exe: wiretrick-helper }
          - { name: linux-arm64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-gnu, exe: wiretrick-helper }
          - { name: macos, os: macos-15-intel, targets: x86_64-apple-darwin aarch64-apple-darwin, exe: wiretrick-helper }
          - { name: windows-x64, os: windows-latest, targets: x86_64-pc-windows-msvc, exe: wiretrick-helper.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Add targets
        run: rustup target add ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper

      - name: fmt + clippy + tests
        run: |
          cargo fmt --check
          HOST="${TARGETS%% *}"
          for T in $TARGETS; do cargo clippy --all-targets --target "$T" -- -D warnings; done
          cargo test --target "$HOST"
        env:
          TARGETS: ${{ matrix.targets }}

      - name: Build, size guard (≤ 6 MB), package
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p ../helper-dist
          for T in $TARGETS; do
            cargo build --release --target "$T"
            BIN="target/$T/release/${{ matrix.exe }}"
            SIZE=$(wc -c < "$BIN")
            echo "$BIN: $SIZE bytes"
            if [ "$SIZE" -gt 6291456 ]; then echo "::error::helper binary grew past 6 MB ($SIZE bytes)"; exit 1; fi
            NAME="wiretrick-helper-$T"
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "$BIN" "../helper-dist/$NAME.exe"
            else
              tar -C "target/$T/release" -czf "../helper-dist/$NAME.tar.gz" "${{ matrix.exe }}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.name }}
          path: helper-dist/*

  release:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Build extension
        run: npm run build

      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./dist/manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG != manifest version $MANIFEST"
            exit 1
          fi
          echo "version $MANIFEST ✓"

      - name: Package zip
        run: |
          VERSION=$(node -p "require('./dist/manifest.json').version")
          zip -qr "wiretrick-mv2-v${VERSION}.zip" dist
          (cd dist-mv3 && zip -qr "../wiretrick-mv3-v${VERSION}.zip" .)
          echo "ZIP_NAME=wiretrick-mv2-v${VERSION}.zip" >> "$GITHUB_ENV"
          echo "ZIP_MV3_NAME=wiretrick-mv3-v${VERSION}.zip" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package crx (signed with CRX_PRIVATE_KEY → stable extension id)
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then echo "::warning::CRX_PRIVATE_KEY secret not set — skipping .crx"; exit 0; fi
          KEY="$RUNNER_TEMP/crx-key.pem"
          printf '%s\n' "$CRX_PRIVATE_KEY" > "$KEY"
          npx -y crx3@2.0.0 -p "$KEY" -o "wiretrick-mv2-v${VERSION}.crx" -- dist
          npx -y crx3@2.0.0 -p "$KEY" -o "wiretrick-mv3-v${VERSION}.crx" -- dist-mv3
          rm -f "$KEY"
          ls -la *.crx

      - name: Package Firefox xpi (signed via AMO when AMO_JWT_* secrets are set)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          XPI="wiretrick-firefox-v${VERSION}.xpi"
          # pasted secrets often carry a trailing newline/space
          AMO_JWT_ISSUER=$(printf %s "$AMO_JWT_ISSUER" | tr -d '[:space:]')
          AMO_JWT_SECRET=$(printf %s "$AMO_JWT_SECRET" | tr -d '[:space:]')
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ] && \
             npx -y web-ext@8 sign -s dist -a amo-signed --channel unlisted \
               --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"; then
            mv amo-signed/*.xpi "$XPI"
            echo "signed $XPI"
          else
            echo "::warning::Firefox xpi is unsigned (AMO_JWT_ISSUER/AMO_JWT_SECRET missing or signing failed)"
            (cd dist && zip -qr "../$XPI" .)
          fi
          echo "XPI_NAME=$XPI" >> "$GITHUB_ENV"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: wiretrick
          path: dist/**

      - name: Download helper binaries
        uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          path: helper-dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd helper-dist
          sha256sum wiretrick-helper-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_MV3_NAME }}
            ${{ env.XPI_NAME }}
            wiretrick-*.crx
            helper-dist/*
          generate_release_notes: true
          body: |
            Current Chrome / Edge / Brave: unzip `wiretrick-mv3-v*.zip`, then chrome://extensions → Developer mode → Load unpacked → the unzipped folder.
            Firefox: install `wiretrick-firefox-v*.xpi` (drag it onto Firefox; an unsigned one needs about:debugging → Load Temporary Add-on, or Developer Edition/Nightly with `xpinstall.signatures.required=false`).
            MV2-capable Chromium: unzip `wiretrick-mv2-v*.zip` and load its `dist` folder.
            Signed `.crx` packages (MV3 and MV2, extension id `jcoealmhehnajkglhfchcnjdpkhnkdei`) are for policy-managed installs or drag-and-drop on Linux; see the README.

            Optional local helper for `strategy: ["process"]` (Chrome). Settings → Local helper shows the command with your extension id filled in; it downloads the right `wiretrick-helper-*` binary below, checks it against `SHA256SUMS`, and installs it:

            ```sh
            # macOS / Linux
            curl -fsSL https://raw.githubusercontent.com/nimatrueway/wiretrick/master/helper/install.sh | sh -s -- --extension-id <id> --trust-ca
            ```
            ```powershell
            # Windows (PowerShell)
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/nimatrueway/wiretrick/master/helper/install.ps1))) -ExtensionId <id> -TrustCa
            ```
