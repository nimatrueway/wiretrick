name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Build extension
        run: npm run build

      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./dist/manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG != manifest version $MANIFEST"
            exit 1
          fi
          echo "version $MANIFEST ✓"

      - name: Package zip
        run: |
          VERSION=$(node -p "require('./dist/manifest.json').version")
          zip -qr "rescript-override-v${VERSION}.zip" dist
          echo "ZIP_NAME=rescript-override-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: rescript-override
          path: dist/**

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            Load from source: unzip, then chrome://extensions → Load unpacked → the unzipped `dist` folder.
